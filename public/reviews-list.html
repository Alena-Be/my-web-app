<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Управление отзывами — SLine</title>
  <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">
        <img src="assets/logo.png" alt="SLine" width="40" height="40" />
        <span>SLine</span>
      </a>
      <nav class="nav">
        <a href="glavnaya">Главная</a>
        <a href="registraciya">Регистрация</a>
        <a href="lichniy-kabinet">Личный кабинет</a>
        <a href="akcii">Акции</a>
        <a href="otzyvy">Отзывы</a>
        <a href="stoimost">Стоимость</a>
        <a href="raspisanie">Расписание</a>
      </nav>
      <div id="authBlock" class="auth-block"></div>
    </div>
  </header>

  <main class="container">
    <h1>Управление отзывами</h1>
    <p><a href="/reviews-add.html" class="btn btn-primary">+ Добавить отзыв</a></p>

    <table class="table" style="width: 100%; border-collapse: collapse; background: #fff;">
      <thead>
        <tr style="background: #f0f0f0;">
          <th style="padding: 10px;">ID</th>
          <th style="padding: 10px;">Имя</th>
          <th style="padding: 10px;">Отзыв</th>
          <th style="padding: 10px;">Действия</th>
        </tr>
      </thead>
      <tbody id="reviewsTableBody">
        <!-- строки подгрузятся через JS -->
      </tbody>
    </table>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="logo"><span>S</span>Line</div>
    </div>
    <div class="copyright">© 2025 SLine</div>
  </footer>

  <script src="assets/app.js"></script>
  <script>
    async function loadReviews() {
      const tbody = document.getElementById('reviewsTableBody');
      try {
        const res = await fetch('/api/reviews');
        const reviews = await res.json();

        if (reviews.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="padding: 10px;">Отзывов нет</td></tr>';
          return;
        }

        tbody.innerHTML = reviews.map(r => `
          <tr>
            <td style="padding: 10px;">${r.id}</td>
            <td style="padding: 10px;">${r.name}</td>
            <td style="padding: 10px;">${r.text}</td>
            <td style="padding: 10px;">
              <a href="/reviews-edit.html?id=${r.id}" class="btn btn-primary">Редактировать</a>
              <a href="/reviews-delete.html?id=${r.id}" class="btn btn-outline">Удалить</a>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="4">Ошибка загрузки</td></tr>';
      }
    }

    loadReviews();
  </script>
</body>
</html>
