<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Удалить отзыв — SLine</title>
  <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/"><span>SLine</span></a>
      <div id="authBlock" class="auth-block"></div>
    </div>
  </header>

  <main class="container narrow">
    <h1>Удалить отзыв</h1>
    <div class="form-card">
      <p id="deleteInfo">Загрузка...</p>
      <button id="confirmDeleteBtn" class="btn btn-primary full" style="background: #e74c3c;">Удалить</button>
      <p class="center"><a href="/reviews-list.html">← К списку</a></p>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    async function loadReview() {
      const res = await fetch(`/api/reviews/${id}`);
      if (!res.ok) { document.getElementById('deleteInfo').textContent = 'Отзыв не найден'; return; }
      const r = await res.json();
      document.getElementById('deleteInfo').innerHTML = `Удалить отзыв от <b>${r.name}</b>:<br>"${r.text}"?`;
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (!confirm('Вы уверены?')) return;
      const res = await fetch(`/api/reviews/${id}`, { method: 'DELETE' });

      if (res.ok) {
        alert('Отзыв удалён');
        window.location.href = '/reviews-list.html';
      } else {
        const data = await res.json();
        alert(data.error || 'Ошибка');
      }
    });

    loadReview();
  </script>
</body>
</html>
